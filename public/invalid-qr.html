<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Amritsari Kulcha</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="/assets/tailwind-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght@20..48,100..700&display=swap" rel="stylesheet">
</head>
<body class="bg-background-cream font-body-md text-on-surface antialiased min-h-screen flex items-center justify-center px-container-margin">
  <div class="max-w-sm text-center flex flex-col items-center gap-stack-sm">
    <span class="material-symbols-outlined text-[48px] text-error">qr_code_scanner</span>
    <h1 class="font-headline-md text-on-background">Table not found</h1>
    <p class="font-body-md text-on-surface-variant">This QR code doesn’t match any of our tables. Please ask a staff member for help.</p>
    <button class="mt-4 bg-primary text-on-primary font-label-bold px-6 py-3 rounded-lg" onclick="history.back()">Go back</button>
  </div>
</body>
</html>
